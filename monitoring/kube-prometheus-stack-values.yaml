# Lean kube-prometheus-stack: Prometheus + Grafana, nothing persistent (no PVC to orphan).
defaultRules:
  create: false
alertmanager:
  enabled: false
nodeExporter:
  enabled: false
prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors from every namespace/release, not only this chart's.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    retention: 12h
    resources:
      requests: {cpu: 150m, memory: 400Mi}
      limits: {cpu: 600m, memory: 900Mi}
grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 300m, memory: 256Mi}
# EKS hides these control-plane components; scraping them only creates false DOWN targets.
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
