# One NLB is the only public entrypoint into the cluster.
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
ports:
  websecure:
    expose:
      default: false
providers:
  kubernetesIngress:
    publishedService:
      enabled: true
deployment:
  replicas: 1
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 300m, memory: 128Mi}
