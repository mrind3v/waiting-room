image:
  registry: ghcr.io/mrind3v
  pullPolicy: IfNotPresent

backend:
  image:
    repository: waiting-room-backend
    tag: ""            # required: the git SHA built by CI
  replicas: 2          # ignored while hpa.backend.enabled
  port: 8000
  clinicTz: Australia/Sydney
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {cpu: 500m, memory: 384Mi}

frontend:
  image:
    repository: waiting-room-frontend
    tag: ""            # required: the git SHA built by CI
  replicas: 2
  port: 8080
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 200m, memory: 96Mi}

postgres:
  image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
  database: waitingroom
  username: waitingroom
  existingSecret: waiting-room-db   # created by scripts/cluster-bootstrap.sh, never in values
  secretKey: password
  storageClass: ""
  size: 1Gi
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {cpu: 500m, memory: 512Mi}

hpa:
  backend:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  frontend:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: traefik
  host: ""             # empty = match any host (the NLB hostname on EKS)

monitoring:
  serviceMonitor:
    enabled: true
  dashboard:
    enabled: true
