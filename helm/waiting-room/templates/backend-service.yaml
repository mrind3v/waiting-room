apiVersion: v1
kind: Service
metadata:
  name: {{ include "wr.fullname" . }}-backend
  labels:
    {{- include "wr.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "wr.selector" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.backend.port }}, targetPort: http}
