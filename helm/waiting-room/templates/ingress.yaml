{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "wr.fullname" . }}
  labels:
    {{- include "wr.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "wr.fullname" . }}-backend
                port: {number: {{ .Values.backend.port }}}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "wr.fullname" . }}-frontend
                port: {number: 80}
{{- end }}
