apiVersion: v1
kind: Service
metadata:
  name: {{ include "wr.fullname" . }}-frontend
  labels:
    {{- include "wr.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "wr.selector" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - {name: http, port: 80, targetPort: http}
